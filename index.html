<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PythonOS — Learn Python from Zero to Advanced</title>
<meta name="description" content="A free, interactive, self-contained Python learning platform: lessons, practice, projects, a playground and more.">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/themes.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<div id="app-shell">
  <div id="sidebar-backdrop"></div>
  <aside id="sidebar">
    <div class="brand">
      <div>
        <span class="logo">Python<span class="dot">OS</span></span>
        <span class="tagline">Zero → Advanced → Real Projects</span>
      </div>
    </div>
    <nav class="side-nav" id="side-nav" aria-label="Main navigation"></nav>
  </aside>

  <div id="main">
    <header id="topbar">
      <button id="menu-toggle" aria-label="Open menu">☰</button>
      <button class="search-btn" id="search-open-btn" aria-label="Open search">
        🔍 <span>Search lessons, glossary, projects…</span> <kbd>Ctrl K</kbd>
      </button>
      <div class="topbar-spacer"></div>
      <span class="streak-chip" id="streak-chip">🔥 0</span>
      <button class="icon-btn" id="theme-toggle" aria-label="Toggle theme" title="Toggle light/dark/system theme">🌓</button>
    </header>
    <main id="content" role="main"></main>
    <footer class="site-footer">
      <strong>PythonOS</strong><br>
      Learn Python. Build Projects. Understand Computer Science.<br>
      <div style="margin-top:.6rem">
        <a href="https://github.com" target="_blank" rel="noopener">GitHub</a>
        <a href="#/roadmap">Curriculum</a>
        <a href="#/projects">Projects</a>
      </div>
    </footer>
  </div>
</div>

<div id="search-modal">
  <div class="search-box">
    <input id="search-input" type="text" placeholder="Search PythonOS… (lessons, glossary, projects)" autocomplete="off">
    <div class="search-results" id="search-results"></div>
  </div>
</div>

<div id="toast"></div>

<script src="js/storage.js"></script>
<script src="js/router.js"></script>
<script src="js/quiz.js"></script>
<script src="js/practice.js"></script>
<script src="js/search.js"></script>
<script src="js/playground.js"></script>
<script src="js/app.js"></script>
</body>
</html>
